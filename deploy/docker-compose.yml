# Application stack: backend (Spring Boot) + frontend (nginx) + Prometheus +
# the MySQL metadata store the backend requires.
#
# Migration data sources (binlog-enabled source MySQL on 3306 + PostgreSQL target)
# live in scripts/test/docker-compose.yml; they are started only for e2e runs:
#
#   docker compose -p opendrs -f deploy/docker-compose.yml \
#       -f scripts/test/docker-compose.yml up -d --wait
#
# The project name is pinned to "opendrs" everywhere (dev.sh, data-sources.sh,
# CI): the first -f file's directory names the project by default, which is no
# longer the repository root now that this file lives in deploy/.
services:
  # Metadata store for the backend (task registry, Debezium offsets, schema history).
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: opendrs-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: opendrs
      MYSQL_USER: opendrs
      MYSQL_PASSWORD: "123456"
    network_mode: host
    command:
      # Explicit port: the e2e-* data sources now own 3306 and up (e2e-mysql1=3306,
      # e2e-mysql2=3307, ...), so the metadata store must not sit on the default.
      - --port=3406
      - --mysqlx-port=34060
      - --bind-address=0.0.0.0
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ../mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P3406",
             "-uopendrs", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 20

  prometheus:
    # docker.m.daocloud.io only proxies Docker Hub's library/* namespace; the official
    # Prometheus image is published to Quay too, and DaoCloud mirrors quay.io.
    image: quay.m.daocloud.io/prometheus/prometheus:v3.2.0
    container_name: opendrs-prometheus
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  backend:
    image: opendrs-backend:local
    build:
      context: ..            # podman classic builder resolves the Dockerfile
      dockerfile: deploy/Dockerfile  # path against CWD, not the context dir
    container_name: opendrs-backend
    network_mode: host
    environment:
      OPENDRS_DB_HOST: 127.0.0.1
      OPENDRS_DB_PORT: "3406"
      OPENDRS_DB_NAME: opendrs
      OPENDRS_DB_USER: opendrs
      OPENDRS_DB_PASSWORD: "123456"
      OPENDRS_PORT: "8080"
      # Empty on purpose: nginx proxies /api from the same origin, so no CORS is needed.
      OPENDRS_CORS_ALLOWED_ORIGINS: "${OPENDRS_CORS_ALLOWED_ORIGINS:-}"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: docker.m.daocloud.io/library/nginx:alpine
    container_name: opendrs-frontend
    network_mode: host
    volumes:
      # Bind mounted rather than baked into an image: `npm run build` on the host is the
      # only refresh step, no image rebuild and no 149 MB node_modules upload.
      - ../opendrs-web/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  # --- Kafka transport buffer (KAFKA path; not used by DIRECT yet) ---
  # Official Apache image (Docker Hub). Do NOT switch to DaoCloud / Aliyun / Tencent mirrors.
  # network_mode: host matches the rest of this stack; advertised listener is 127.0.0.1
  # so backend (also host-networked) can reach the broker. Host ports used: 9092 (clients),
  # 9093 (KRaft controller, localhost only).
  kafka:
    image: apache/kafka:3.7.0
    container_name: opendrs-kafka
    network_mode: host
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # Schema Registry (Apicurio 3.x unified image on Quay — official, not a CN mirror).
  # HTTP on 8081 because backend already owns host :8080. Storage = kafkasql on local Kafka.
  apicurio:
    image: quay.io/apicurio/apicurio-registry:3.3.4
    container_name: opendrs-apicurio
    network_mode: host
    environment:
      QUARKUS_HTTP_PORT: "8081"
      APICURIO_STORAGE_KIND: kafkasql
      APICURIO_KAFKASQL_BOOTSTRAP_SERVERS: 127.0.0.1:9092
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      # Apicurio 3.x exposes SmallRye Health on the Quarkus management port (9000), not :8081.
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:9000/health/ready >/dev/null
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

volumes:
  kafka_data:
