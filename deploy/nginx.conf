server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # vue-router runs in history mode, so any unknown path must return the SPA shell
    # instead of a 404. Without this, refreshing on /tasks/42 breaks.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The shell itself must never be cached, otherwise a rebuilt bundle is not picked up.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Same-origin API entry point. The backend shares the host network namespace,
    # so loopback is the correct upstream.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
