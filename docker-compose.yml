# Application stack: backend (Spring Boot) + frontend (nginx) + Prometheus +
# the MySQL metadata store the backend requires.
#
# Migration data sources (binlog-enabled source MySQL on 3406 + PostgreSQL target)
# live in scripts/test/docker-compose.yml; they are started only for e2e runs:
#
#   docker compose -f docker-compose.yml -f scripts/test/docker-compose.yml up -d --wait
#
# This file must stay first on the command line: compose resolves relative
# paths against the first -f file's directory, and every path below is
# repository-root relative.
services:
  # Metadata store for the backend (task registry, Debezium offsets, schema history).
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: opendrs-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: opendrs
      MYSQL_USER: opendrs
      MYSQL_PASSWORD: "123456"
    network_mode: host
    command:
      - --bind-address=0.0.0.0
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uopendrs", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 20

  prometheus:
    # docker.m.daocloud.io only proxies Docker Hub's library/* namespace; the official
    # Prometheus image is published to Quay too, and DaoCloud mirrors quay.io.
    image: quay.m.daocloud.io/prometheus/prometheus:v3.2.0
    container_name: opendrs-prometheus
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  backend:
    image: opendrs-backend:local
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    container_name: opendrs-backend
    network_mode: host
    environment:
      OPENDRS_DB_HOST: 127.0.0.1
      OPENDRS_DB_PORT: "3306"
      OPENDRS_DB_NAME: opendrs
      OPENDRS_DB_USER: opendrs
      OPENDRS_DB_PASSWORD: "123456"
      OPENDRS_PORT: "8080"
      # Empty on purpose: nginx proxies /api from the same origin, so no CORS is needed.
      OPENDRS_CORS_ALLOWED_ORIGINS: "${OPENDRS_CORS_ALLOWED_ORIGINS:-}"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: docker.m.daocloud.io/library/nginx:alpine
    container_name: opendrs-frontend
    network_mode: host
    volumes:
      # Bind mounted rather than baked into an image: `npm run build` on the host is the
      # only refresh step, no image rebuild and no 149 MB node_modules upload.
      - ./opendrs-web/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
