spring:
  application:
    name: opendrs-service
  messages:
    # i18n bundles: messages.properties (base) + messages_zh_CN.properties (Chinese).
    basename: messages
    encoding: UTF-8
    # Never let the server's OS language leak into message fallback.
    fallback-to-system-locale: false
    # A missing key must fail loudly in dev instead of rendering the raw key to users.
    use-code-as-default-message: false
  datasource:
    url: jdbc:mysql://${OPENDRS_DB_HOST:localhost}:${OPENDRS_DB_PORT:3306}/${OPENDRS_DB_NAME:opendrs}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: ${OPENDRS_DB_USER:opendrs}
    password: ${OPENDRS_DB_PASSWORD:opendrs}
  flyway:
    enabled: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-handlers-package: io.opendrs.migration.mapper.type
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${OPENDRS_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    prometheus:
      enabled: true

opendrs:
  task:
    dispatch-enabled: true
    dispatch-ms: 2000
  metrics:
    # Prometheus the task-metrics proxy queries. Host networking everywhere means the
    # in-cluster address is the same loopback the scrape target listens on.
    prometheus-url: ${OPENDRS_PROMETHEUS_URL:http://127.0.0.1:9090}
  cors:
    # Comma separated origins. Empty means "same origin only" - the default deployment
    # serves the SPA and /api from one nginx origin and needs no CORS at all.
    allowed-origins: ${OPENDRS_CORS_ALLOWED_ORIGINS:}

  # CDC transport between capture and replay. DIRECT = apply then mark (default, no Kafka).
  # KAFKA = produce SourceRecord envelopes to opendrs.pipeline.{pipeline.public_id}, mark on
  # produce success; replay consumer group opendrs.replay.{public_id} applies and writes
  # pipeline_applied_offsets. Serialization is Connect JSON envelope (not demo flat Avro).
  transport:
    channel: ${OPENDRS_TRANSPORT_CHANNEL:DIRECT}
    kafka-bootstrap-servers: ${OPENDRS_KAFKA_BOOTSTRAP:127.0.0.1:9092}
    schema-registry-url: ${OPENDRS_SCHEMA_REGISTRY_URL:http://127.0.0.1:8081}
  datacheck:
    # Tables checked in parallel within one check task. The coordinator pool itself is fixed at 4.
    concurrency: ${OPENDRS_DATACHECK_CONCURRENCY:8}

