# Explicit English bundle. The base messages.properties holds the same text as the last-resort
# fallback; keeping a real messages_en.properties makes the en lookup stop here instead of
# relying on root-bundle fallback (which the JDK resolves through the JVM default locale).
# Templates use MessageFormat placeholders ({0}, {1}, ...); never concatenate values at call sites.

