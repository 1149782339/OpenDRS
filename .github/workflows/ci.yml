name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      # Local tooling and docs: no code or tests change, a full CI run is pure waste.
      # Frontend sources stay INCLUDED — the frontend build job is the only check
      # opendrs-web currently has.
      - 'deploy/**'
      - 'scripts/**'
      - '*.md'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'deploy/**'
      - 'scripts/**'
      - '*.md'
      - '**/*.md'

jobs:
  backend:
    name: Backend (Maven test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Unit tests
        # Container-based ITs were removed; e2e lives in scripts/test (framework runner).
        run: mvn test

  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opendrs-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: opendrs-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

  e2e:
    name: E2E (full migration MySQL -> PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: opendrs-web/package-lock.json

      # Host-side build, containers only run it (mirrors deploy/dev.sh's approach).
      - name: Build backend jar
        run: mvn -q -B -DskipTests package

      - name: Build frontend bundle
        run: cd opendrs-web && npm ci && npm run build

      # Application stack (backend + frontend + prometheus + metadata MySQL) plus the
      # migration data sources from scripts/test (source MySQL :3306, target PostgreSQL :5432).
      # -p opendrs pins the project (default would follow deploy/, breaking volume
      #   sharing with scripts/test/data-sources.sh); the deploy file must come first
      #   so relative paths in the second file resolve consistently.
      - name: Start stacks
        run: docker compose -p opendrs -f deploy/docker-compose.yml -f scripts/test/docker-compose.yml up -d --wait

      - name: Wait for API through nginx
        run: |
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 \
              http://127.0.0.1/api/v1/migration/connections || true)
            [ "$code" = "200" ] && exit 0
            sleep 1
          done
          docker compose -p opendrs -f deploy/docker-compose.yml -f scripts/test/docker-compose.yml logs --tail 60 backend
          exit 1

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Framework runner: datasource fast-fail -> mysql2pg (full, full+inc) ->
      # mysql2pg_bi, stages ordered, cases within a stage parallel. Replaces the
      # retired e2e_smoke.py / e2e_test.py (superseded by the framework cases).
      - name: Run test framework (ci profile)
        working-directory: scripts/test
        run: bash ./run_test.sh --profile profiles/ci.yml

      - name: Teardown
        if: always()
        run: docker compose -p opendrs -f deploy/docker-compose.yml -f scripts/test/docker-compose.yml down -v
