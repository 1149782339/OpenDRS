# Kafka-transport e2e: CdcTransportSpec=KAFKA full+inc with DDL.
# Requires deploy stack Kafka + Apicurio (and e2e mysql/pg data sources).

env:
  endpoint:
    url: "http://127.0.0.1"
    user: admin
    password: "123456"
  datasources:
    mysql1:
      host: "127.0.0.1"
      port: 3306
      user: "e2e_mysql"
      password: "123456"
      database: "e2e_db"
      root_password: "123456"
    postgres1:
      host: "127.0.0.1"
      port: 5432
      user: "e2e_postgres"
      password: "123456"
      database: "e2e_db"

config:
  max_parallel: 1
  case_timeout_sec: 900

testcases:
  - name: mysql2pg_kafka
    tests:
      - mysql2pg_full_inc_kafka
