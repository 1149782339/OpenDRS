# CI profile: the full suite. Stages run in the listed order; cases inside a
# stage run in parallel (capped by config.max_parallel). Passwords are hardcoded
# on purpose — these are disposable local/CI containers. ${VAR} expansion is
# still supported for when a profile needs real secrets.

env:
  endpoint:
    url: "http://127.0.0.1"
    user: admin          # reserved for when the backend grows auth
    password: "123456"
  datasources:
    mysql1:              # migration source (binlog ROW + GTID)
      host: "127.0.0.1"
      port: 3406
      user: "e2e_mysql"
      password: "123456"
      database: "e2e_db"
      root_password: "123456"
    postgres1:           # migration target
      host: "127.0.0.1"
      port: 5432
      user: "e2e_postgres"
      password: "123456"
      database: "e2e_db"

config:
  max_parallel: 4        # per-stage xdist workers; keep low — parallel cases are
                         # harder to analyse and CI CPUs are capped
  case_timeout_sec: 900  # per-case wall clock; the runner has no other global guard

testcases:
  - name: datasource
  - name: mysql2pg
    tests:
      - mysql2pg_full
      - mysql2pg_full_inc
  - name: mysql2pg_bi
    tests:
      - mysql2pg_full_fi
      - mysql2pg_full_inc_fi
