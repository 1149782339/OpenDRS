# Overlay applied on top of docker-compose.yml:
#   docker-compose -f docker-compose.yml -f docker-compose.app.yml up -d --build
#
# This file lives at the repository root on purpose. The compose implementation here
# resolves relative paths against the project directory (the directory of the first -f
# file), not against each file's own directory, so keeping both files side by side is what
# makes `context: .` mean the repository root.
#
# Everything runs with network_mode: host so the backend reaches the MySQL metadata store
# and the PostgreSQL target on 127.0.0.1, exactly like the un-containerised dev setup, and
# so CDC can reach whatever source database the user registered.
services:
  backend:
    image: opendrs-backend:local
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    container_name: opendrs-backend
    network_mode: host
    environment:
      OPENDRS_DB_HOST: 127.0.0.1
      OPENDRS_DB_PORT: "3306"
      OPENDRS_DB_NAME: opendrs
      OPENDRS_DB_USER: opendrs
      OPENDRS_DB_PASSWORD: "123456"
      OPENDRS_PORT: "8080"
      # Empty on purpose: nginx proxies /api from the same origin, so no CORS is needed.
      OPENDRS_CORS_ALLOWED_ORIGINS: "${OPENDRS_CORS_ALLOWED_ORIGINS:-}"
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend:
    image: docker.m.daocloud.io/library/nginx:alpine
    container_name: opendrs-frontend
    network_mode: host
    volumes:
      # Bind mounted rather than baked into an image: `npm run build` on the host is the
      # only refresh step, no image rebuild and no 149 MB node_modules upload.
      - ./opendrs-web/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
